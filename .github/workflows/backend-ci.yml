name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agriassist_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agriassist_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGRIASSIST_TEST_POSTGRES_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=agriassist_tests;Username=postgres;Password=postgres;Ssl Mode=Disable
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend tests
        run: dotnet restore backend/AgriAssist.Api.Tests/AgriAssist.Api.Tests.csproj

      - name: Build backend tests
        run: dotnet build backend/AgriAssist.Api.Tests/AgriAssist.Api.Tests.csproj --configuration Release --no-restore

      - name: Test backend
        run: dotnet test backend/AgriAssist.Api.Tests/AgriAssist.Api.Tests.csproj --configuration Release --no-build

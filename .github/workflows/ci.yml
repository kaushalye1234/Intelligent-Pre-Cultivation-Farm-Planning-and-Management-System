name: AgriAssist CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install AI service dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile AI service
        run: python -m compileall -q .
      - name: Import AI service application
        run: python -c "import main"
      - name: Test AI service
        run: python -m pytest

  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/react-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/react-app/package-lock.json
      - name: Install React dependencies
        run: npm ci
      - name: Lint React app
        run: npm run lint
      - name: Build React app
        run: npm run build
      - name: Test React app
        run: npm test

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/flutter_app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze Flutter app
        run: flutter analyze
      - name: Test Flutter app
        # Run files separately because the aggregate Flutter runner can hang
        # while loading multiple widget test isolates on some runners.
        run: |
          for test_file in test/*_test.dart; do
            flutter test --no-pub "$test_file"
          done
